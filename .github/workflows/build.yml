name: Build PX7

on:
  push:
    tags:
      - "v*"

jobs:

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt pyinstaller

      - name: Build Windows
        shell: cmd
        run: |
          pyinstaller ^
          --onedir ^
          --noconsole ^
          --noupx ^
          --name PX7 ^
          --icon "neutralino/resources/icons/PX7.ico" ^
          --add-data "templates;templates" ^
          --add-data "static;static" ^
          --add-binary "neutralino/bin/neutralino-win_x64.exe;neutralino/bin" ^
          --add-binary "neutralino/resources.neu;neutralino/bin" ^
          --add-data "neutralino/neutralino.config.json;neutralino" ^
          --add-data "neutralino/resources/icons/PX7.ico;neutralino/resources/icons" ^
          --collect-all yt_dlp ^
          --collect-all flask ^
          --collect-all requests ^
          launcher.py

      - name: Zip artifact
        shell: pwsh
        run: |
          Copy-Item -Recurse dist\PX7 PX7
          Compress-Archive -Path PX7\* -DestinationPath PX7-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PX7-windows
          path: PX7-windows.zip


  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          chmod +x neutralino/bin/*
          pip install -r requirements.txt pyinstaller

      - name: Build Linux
        run: |
          pyinstaller \
          --onedir \
          --noconsole \
          --noupx \
          --name PX7 \
          --icon "neutralino/resources/icons/PX7.png" \
          --add-data "templates:templates" \
          --add-data "static:static" \
          --add-binary "neutralino/bin/neutralino-linux_x64:neutralino/bin" \
          --add-binary "neutralino/resources.neu:neutralino/bin" \
          --add-data "neutralino/neutralino.config.json:neutralino" \
          --add-data "neutralino/resources/icons/PX7.png:neutralino/resources/icons" \
          --collect-all yt_dlp \
          --collect-all flask \
          --collect-all requests \
          launcher.py

      - name: Zip artifact
        run: |
          cp -r dist/PX7 PX7
          zip -r PX7-linux.zip PX7

      - uses: actions/upload-artifact@v4
        with:
          name: PX7-linux
          path: PX7-linux.zip


  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          chmod +x neutralino/bin/*
          pip install -r requirements.txt pyinstaller

      - name: Convert PNG to ICNS
        run: |
          mkdir -p /tmp/PX7.iconset
          sips -z 16 16     neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_16x16.png
          sips -z 32 32     neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_16x16@2x.png
          sips -z 32 32     neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_32x32.png
          sips -z 64 64     neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_32x32@2x.png
          sips -z 128 128   neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_128x128.png
          sips -z 256 256   neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_128x128@2x.png
          sips -z 256 256   neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_256x256.png
          sips -z 512 512   neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_256x256@2x.png
          sips -z 512 512   neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_512x512.png
          sips -z 1024 1024 neutralino/resources/icons/PX7.png --out /tmp/PX7.iconset/icon_512x512@2x.png
          iconutil -c icns /tmp/PX7.iconset -o /tmp/PX7.icns

      - name: Build macOS
        run: |
          pyinstaller \
          --onedir \
          --noconsole \
          --noupx \
          --name PX7 \
          --icon "/tmp/PX7.icns" \
          --add-data "templates:templates" \
          --add-data "static:static" \
          --add-binary "neutralino/bin/neutralino-mac_universal:neutralino/bin" \
          --add-binary "neutralino/resources.neu:neutralino/bin" \
          --add-data "neutralino/neutralino.config.json:neutralino" \
          --add-data "neutralino/resources/icons/PX7.png:neutralino/resources/icons" \
          --collect-all yt_dlp \
          --collect-all flask \
          --collect-all requests \
          launcher.py

      - name: Zip artifact
        run: |
          cp -r dist/PX7 PX7
          zip -r PX7-macos.zip PX7

      - uses: actions/upload-artifact@v4
        with:
          name: PX7-macos
          path: PX7-macos.zip


  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PX7-windows/PX7-windows.zip
            artifacts/PX7-linux/PX7-linux.zip
            artifacts/PX7-macos/PX7-macos.zip